<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매장 / 좌석 · PC방 HOME</title><link rel="stylesheet" href="/assets/app.css"></head><body data-admin-page="operator"><div class="admin-shell"><aside class="side"><a class="brand" href="/admin.html"><span class="brandmark"></span>PC방 HOME</a><nav><a class="" href="/admin.html">운영 대시보드</a><a class="" href="/admin-sessions.html">세션 / 배정</a><a class="active" href="/admin-stores.html">매장 / 좌석</a><a class="" data-super-nav href="/admin-users.html">회원 관리</a><a class="" data-super-nav href="/admin-billing.html">결제 / 충전</a></nav><div class="side-bottom">운영 시스템<br>실시간 PC 상태 · 배정 · WoL</div></aside><main class="admin-main"><div class="admin-head"><div><h1>매장 / 좌석</h1><p>PC방 매장과 공인 IP, 등록 좌석의 온라인 상태를 관리합니다.</p></div><button class="btn btn-secondary" id="openStoreForm">매장 등록</button></div><section id="storeForm" class="account-card table-page" hidden><h3>새 매장 등록</h3><div class="store-form-grid"><div class="field"><label for="storeName">매장명</label><input id="storeName" autocomplete="organization"></div><div class="field"><label for="storeRegion">지역</label><input id="storeRegion" placeholder="예: 경기 성남"></div><div class="field"><label for="storeIp">공인 IP</label><input id="storeIp" inputmode="decimal" placeholder="예: 203.0.113.80"></div></div><div class="row-actions"><button class="btn btn-primary" id="saveStore">등록</button><button class="btn btn-secondary" id="cancelStore">취소</button></div></section><section id="storeRows" class="stack table-page"></section><section class="panel table-page"><div class="panel-head"><div><h2>좌석 / PC 등록</h2><p class="panel-sub">원격 임대에 사용할 실제 PC방 좌석을 매장에 연결합니다.</p></div><button class="btn btn-secondary" id="openPcForm">PC 등록</button></div><div id="pcForm" class="pc-register" hidden><div class="pc-form-grid"><div class="field"><label for="pcStore">매장</label><select id="pcStore"></select></div><div class="field"><label for="pcSeat">좌석 번호</label><input id="pcSeat" inputmode="numeric" placeholder="예: 109"></div><div class="field"><label for="pcPrivateIp">PC 내부 IP</label><input id="pcPrivateIp" inputmode="decimal" placeholder="예: 10.31.2.109"></div><div class="field"><label for="pcMac">MAC 주소</label><input id="pcMac" autocomplete="off" placeholder="예: 02:00:00:00:01:09"></div><div class="field"><label for="pcGpu">GPU</label><input id="pcGpu" autocomplete="off" placeholder="예: RTX 4060 Ti"></div></div><div class="row-actions"><button class="btn btn-primary" id="savePc">등록</button><button class="btn btn-secondary" id="cancelPc">취소</button></div></div><div class="pc-list-wrap"><table class="pc-table compact-pc"><thead><tr><th>PC / 좌석</th><th>매장</th><th>상태</th><th>내부 IP</th><th>GPU</th></tr></thead><tbody id="storePcRows"></tbody></table></div></section></main></div><div id="toast" class="toast"></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
