<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>최초 관리자 설정 · PC방 HOME</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>최초 관리자<br>계정을 설정합니다.</h1><p>배포 로그에 표시된 일회용 설정 코드로 최고관리자 계정을 한 번만 생성할 수 있습니다.</p></div><div class="muted">설정 완료 후 일회용 코드는 자동 폐기됩니다.</div></section><section class="auth-side"><form class="auth-card" id="adminSetupForm"><h2>최고관리자 설정</h2><p class="desc">실제로 사용할 관리자 정보를 입력하세요.</p><div class="field"><label>이름</label><input name="name" autocomplete="name" required></div><div class="field"><label>이메일</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>일회용 설정 코드</label><input name="token" autocomplete="off" required></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">최고관리자 계정 만들기</button><div class="auth-foot"><a href="/admin-login.html">관리자 로그인으로 돌아가기</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
