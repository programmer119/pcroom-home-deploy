<!DOCTYPE html>

<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>관리자 로그인 · PC방 HOME</title><link href="/assets/app.css" rel="stylesheet"/></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>운영 권한에 맞는<br/>관리 화면으로.</h1><p>매장관리자는 좌석·세션 운영 화면을, 최고관리자는 회원·결제 현황까지 관리합니다.</p></div><div class="muted">관리자 전용 로그인</div></section><section class="auth-side"><form class="auth-card" data-admin="1" id="loginForm"><h2>관리자 로그인</h2><p class="desc">관리 권한이 부여된 계정으로 로그인하세요.</p><div class="review-login" data-review-login="" hidden=""><div class="review-login-head"><div><strong>계정 등급별 검수 로그인</strong><span>클라이언트 확인용</span></div><button aria-label="검수 로그인 안내" class="review-info" title="등급을 선택하면 검수 계정의 이메일과 비밀번호가 자동 입력됩니다. 실제 접근 권한은 서버의 계정 등급으로 판정합니다." type="button">i</button></div><div class="field review-field"><label>확인할 계정 등급</label><select data-review-role=""><option value="">직접 입력</option></select></div><p class="review-login-hint" data-review-hint="">등급을 선택하면 해당 권한의 화면을 바로 확인할 수 있습니다.</p></div><div class="field"><label>이메일</label><input autocomplete="email" name="email" required="" type="email"/></div><div class="field"><label>비밀번호</label><input autocomplete="current-password" name="password" required="" type="password"/></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">관리자 로그인</button><div class="auth-foot"><a href="/login.html">일반 회원 로그인</a> · <a href="/admin-setup.html">최초 관리자 설정</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
