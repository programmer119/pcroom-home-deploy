<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · PC방 HOME</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>집에서 접속해도<br>PC방은 실제 PC로.</h1><p>실제 PC방 좌석을 원격으로 배정하고, 이용한 시간만 차감하는 원격 PC 임대 서비스입니다.</p><div class="auth-points"><div class="auth-point"><span class="num">1</span><span>이용권 기능 제공 예정</span></div><div class="auth-point"><span class="num">2</span><span>리소스 상태 기반 최적 PC 자동배정</span></div><div class="auth-point"><span class="num">3</span><span>종료 즉시 세션 정리와 시간차감 중단</span></div></div></div><div class="muted">Windows 전용 접속기 · 반응형 웹</div></section><section class="auth-side"><form class="auth-card" id="loginForm"><h2>로그인</h2><p class="desc">내 이용시간과 최근 접속내역을 확인합니다.</p><div class="review-login" data-review-login hidden><div class="review-login-head"><div><strong>계정 등급별 검수 로그인</strong><span>클라이언트 확인용</span></div><button class="review-info" type="button" title="등급을 선택하면 검수 계정의 이메일과 비밀번호가 자동 입력됩니다. 실제 접근 권한은 서버의 계정 등급으로 판정합니다." aria-label="검수 로그인 안내">i</button></div><div class="field review-field"><label>확인할 계정 등급</label><select data-review-role><option value="">직접 입력</option></select></div><p class="review-login-hint" data-review-hint>등급을 선택하면 해당 권한의 화면을 바로 확인할 수 있습니다.</p></div><div class="field"><label>이메일</label><input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">로그인</button><div class="auth-foot">처음 이용하시나요? <a href="/signup.html">회원가입</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
