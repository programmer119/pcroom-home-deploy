<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · PC방 HOME</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>집에서 접속해도<br>PC방은 실제 PC로.</h1><p>실제 PC방 좌석을 원격으로 배정하고, 이용한 시간만 차감하는 원격 PC 임대 서비스입니다.</p><div class="auth-points"><div class="auth-point"><span class="num">1</span><span>이용권 충전 후 바로 연결</span></div><div class="auth-point"><span class="num">2</span><span>리소스 상태 기반 최적 PC 자동배정</span></div><div class="auth-point"><span class="num">3</span><span>종료 즉시 세션 정리와 시간차감 중단</span></div></div></div><div class="muted">Windows 전용 접속기 · 반응형 웹</div></section><section class="auth-side"><form class="auth-card" id="loginForm"><h2>로그인</h2><p class="desc">충전한 이용시간과 최근 접속내역을 이어서 사용합니다.</p><div class="field"><label>이메일</label><input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">로그인</button><div class="auth-foot">처음 이용하시나요? <a href="/signup.html">회원가입</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
