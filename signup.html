<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 · PC방 HOME</title><link rel="stylesheet" href="/assets/app.css"></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>충전하고,<br>바로 PC를 배정받으세요.</h1><p>가입 후 이용시간을 충전하면 별도 예약 없이 사용 가능한 PC를 자동으로 찾습니다.</p></div><div class="muted">PC방 혜택 원격 이용 · 실제 PC 임대 방식</div></section><section class="auth-side"><form class="auth-card" id="signupForm"><h2>회원가입</h2><p class="desc">원격 PC 이용을 위한 기본 계정을 만듭니다.</p><div class="field"><label>이름</label><input name="name" autocomplete="name" placeholder="이름" required></div><div class="field"><label>이메일</label><input name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div><div class="field"><label>비밀번호</label><input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상" required></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">계정 만들기</button><div class="auth-foot">이미 계정이 있나요? <a href="/login.html">로그인</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
