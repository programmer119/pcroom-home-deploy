<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>회원가입 · PC방 HOME</title><link href="/assets/app.css" rel="stylesheet"/></head><body><div class="auth-wrap"><section class="auth-story"><div><a class="brand" href="/"><span class="brandmark"></span>PC방 HOME</a><h1>실제 계정을 만들고,<br/>서비스를 시작하세요.</h1><p>실제 PC방 좌석을 원격으로 배정받고, 사용한 시간만 차감합니다.</p></div><div class="muted">Windows 접속기 · 반응형 웹</div></section><section class="auth-side"><form class="auth-card" id="signupForm"><h2>회원가입</h2><p class="desc">원격 PC 이용을 위한 기본 계정을 만듭니다.</p><div class="field"><label>이름</label><input autocomplete="name" name="name" placeholder="이름" required=""/></div><div class="field"><label>이메일</label><input autocomplete="email" name="email" placeholder="name@example.com" required="" type="email"/></div><div class="field"><label>비밀번호</label><input autocomplete="new-password" minlength="8" name="password" placeholder="8자 이상" required="" type="password"/></div><div class="form-error" id="formError"></div><button class="btn btn-primary full" type="submit">계정 만들기</button><div class="auth-foot">이미 계정이 있나요? <a href="/login.html">로그인</a></div></form></section></div><script src="/config.js"></script><script src="/assets/app.js"></script></body></html>
